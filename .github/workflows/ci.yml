name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Build the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the Node.js packages
        run: npm ci
      - name: Lint the source
        run: npm run lint
      - name: Test the model
        run: npm run test:model
      - name: Build the app
        run: npm run build
